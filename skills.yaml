interpretation:
  source_supported: Explicit CV-backed task or background record; not independent employment or proficiency
    verification.
  self_reported: Listed skill or familiarity without a task-specific demonstration in the supplied evidence.
  proficiency_policy: No numeric proficiency or years; only supplied natural-language proficiency levels are
    retained.
  association_policy: Related records support the specific cited task; never infer a stack or language from
    an adjacent technology.
